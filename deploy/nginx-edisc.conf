# Blocs à insérer dans le server { listen 443; server_name gofolyx.com ... }
# de /opt/backend-stack/nginx-config/nginx.conf, JUSTE AVANT `location / {`.
#
# Après édition : redémarrer (pas reload) le conteneur nginx —
#   cd /opt/backend-stack && docker compose -f docker-compose.prod.yml restart nginx
# (le fichier est bind-monté par inode ; sed/rewrite change l'inode).
#
# Prérequis : docker network connect edisc_net stream_nginx

# ── E-discussion (messagerie) — sous-chemin /edisc/ ───────────────────────
# WebSocket temps réel : préfixe ^~ plus long => prioritaire sur `^~ /edisc/`
# ET sur les locations regex. Indispensable sinon /edisc/api/v1/ws tombe dans
# le bloc REST (Connection "") et le handshake WS échoue en 404.
location ^~ /edisc/api/v1/ws {
    rewrite ^/edisc/(.*)$ /$1 break;
    proxy_pass http://edisc_api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  86400;
    proxy_send_timeout  86400;
    proxy_buffering off;
}

# API REST + fichiers médias du messager
location ^~ /edisc/ {
    rewrite ^/edisc/(.*)$ /$1 break;
    proxy_pass http://edisc_api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
    client_max_body_size  128M;
}

# ── SFU LiveKit auto-hébergé — sous-chemin /edisc-sfu/ ────────────────────
# LiveKit tourne en network_mode: host -> joignable via la gateway docker.
location ^~ /edisc-sfu/ {
    rewrite ^/edisc-sfu/(.*)$ /$1 break;
    proxy_pass http://172.17.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  86400;
    proxy_send_timeout  86400;
    proxy_buffering off;
}
